<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CANFAR is offline</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #eef1f6;
      color: #1c2430;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    main {
      max-width: 36rem;
      background: #fff;
      border: 1px solid #d5dbe3;
      border-top: 4px solid #1e3282;
      border-radius: 8px;
      padding: 2rem 2.25rem;
      box-shadow: 0 8px 24px rgba(30, 50, 130, 0.08);
    }

    p {
      margin: 0;
      line-height: 1.5;
    }

    .kicker {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #1e3282;
    }

    h1 {
      margin: 0.4rem 0 1rem;
      font-size: 1.75rem;
      font-weight: 600;
    }

    .thanks {
      margin-top: 1.25rem;
      color: #4a5568;
    }
  </style>

<body>
  <main>
    <p class="kicker">Service notice</p>
    <h1>CANFAR is offline</h1>
    <p>
      Systems are offline while we carry out infrastructure upgrades.
      We anticipate a return to normal by Monday, October 5, 2026 at 23:00 UTC.
